# Konfigurasi Nginx untuk verificatorpmu.online -> SSOCR FastAPI Backend
# Letakkan di /etc/nginx/sites-available/ssocr

server {
    listen 80;
    server_name verificatorpmu.online;
    
    # Redirect HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name verificatorpmu.online;

    # SSL Certificate (Sesuaikan path jika menggunakan Let's Encrypt / Cloudflare / custom cert)
    # ssl_certificate /etc/letsencrypt/live/verificatorpmu.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/verificatorpmu.online/privkey.pem;

    # PENTING: Batas upload gambar dari kamera Android (default Nginx hanya 1M)
    client_max_body_size 25M;

    # Timeout agar tidak putus saat upload & pemrosesan gambar
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Reverse proxy ke container Docker SSOCR (port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (jika dibutuhkan di kemudian hari)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
