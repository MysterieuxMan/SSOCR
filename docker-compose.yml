services:
  ssocr-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssocr-backend
    restart: always
    ports:
      # Host port 8001 -> Container port 8000 (menghindari konflik port 8000 di host VPS)
      - "127.0.0.1:8001:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - CORS_ORIGINS=["*"]
